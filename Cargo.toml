[package]
name = "rex-skills"
version = "0.1.4"
edition = "2024"
authors = ["Shaun McDonogh"]
description = "Install the rex agent skill bundle into any project, plus a CODEBASE.md tree generator"
license = "MIT"
repository = "https://github.com/coderaidershaun/rex-skills"
readme = "README.md"
keywords = ["skills", "agent", "claude", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [".claude/**/*", "src/**/*", "build.rs", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "rex"
path = "src/main.rs"

[lib]
name = "rex_skills"
path = "src/lib.rs"

[dependencies]
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
clap = { version = "4.6.1", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
ignore = { version = "0.4.25", default-features = false }
include_dir = { version = "0.7.4", default-features = false }
thiserror = { version = "2.0.18", default-features = false }

[dev-dependencies]
assert_cmd = { version = "2.2.1", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
